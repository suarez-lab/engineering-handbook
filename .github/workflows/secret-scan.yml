# Copiar a .github/workflows/secret-scan.yml en CADA repo público de suarez-lab.
name: secret-scan
on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # lunes 06:00 UTC — red de seguridad

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # historial completo: un secreto borrado sigue en los commits
      # CLI directo (MIT): gitleaks-action@v2 exige GITLEAKS_LICENSE de pago en repos de organización.
      - name: gitleaks (CLI, versión fijada + checksum)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          TGZ="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$TGZ" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TGZ}"
          echo "${GITLEAKS_SHA256}  ${TGZ}" | sha256sum -c -
          tar -xzf "$TGZ" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .

  forbidden-strings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rutas internas y marcadores del workspace
        run: |
          set -e
          PATRONES='/Users/|00-active/|99-config/|\.run\.app|s2a2-projects'
          if grep -rInE "$PATRONES" --exclude-dir=.git --exclude-dir=.github .; then
            echo "::error::Se han filtrado rutas o marcadores internos. Ver coincidencias arriba."
            exit 1
          fi
          echo "OK — sin rutas internas."
